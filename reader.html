<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>正在加载文章 · NEWLIFE.007</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --surface: #121a30;
      --text: #eef2ff;
      --muted: #aab6d6;
      --line: rgba(181, 199, 255, 0.17);
      --cyan: #62e7ff;
      --violet: #b69aff;
      --code: #090d19;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { min-width: 320px; margin: 0; color: var(--text); background: radial-gradient(circle at 78% -20%, rgba(116, 92, 255, 0.2), transparent 31rem), var(--bg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; line-height: 1.75; }
    .loading, .error { display: grid; min-height: 100vh; place-items: center; padding: 2rem; text-align: center; color: var(--muted); }
    .loading span { display: inline-block; width: 0.68rem; height: 0.68rem; margin-right: 0.6rem; border: 2px solid rgba(98, 231, 255, 0.25); border-top-color: var(--cyan); border-radius: 50%; animation: spin 800ms linear infinite; vertical-align: -0.05rem; }
    .error > div { max-width: 38rem; padding: 2rem; border: 1px solid rgba(255, 130, 180, 0.3); border-radius: 1rem; background: rgba(49, 22, 46, 0.36); }
    .error h1 { margin: 0 0 0.7rem; color: #ffd6e9; font-size: 1.35rem; }
    .error p { margin: 0; }
    .article { width: min(calc(100% - 2.5rem), 940px); margin: 0 auto; padding: clamp(2rem, 6vw, 4rem) 0 5rem; }
    .article > :first-child { margin-top: 0; }
    h1, h2, h3, h4 { scroll-margin-top: 1.5rem; letter-spacing: -0.035em; line-height: 1.2; }
    h1 { margin: 0 0 1.65rem; font-size: clamp(2rem, 5.5vw, 3.75rem); }
    h2 { margin: 3.6rem 0 1.15rem; padding-bottom: 0.65rem; border-bottom: 1px solid var(--line); color: #fafbff; font-size: clamp(1.55rem, 3vw, 2.2rem); }
    h3 { margin: 2.45rem 0 0.85rem; color: #f7f8ff; font-size: clamp(1.2rem, 2.2vw, 1.58rem); }
    h4 { margin: 1.8rem 0 0.6rem; font-size: 1.05rem; }
    p, ul, ol { margin: 1.05rem 0; }
    ul, ol { padding-left: 1.45rem; }
    li + li { margin-top: 0.3rem; }
    a { color: var(--cyan); text-decoration-color: rgba(98, 231, 255, 0.45); text-underline-offset: 0.18em; }
    a:hover { color: #c8f7ff; }
    strong { color: #fff; }
    em { color: #d9d4ff; }
    hr { height: 1px; margin: 2.75rem 0; border: 0; background: var(--line); }
    blockquote { margin: 1.6rem 0; padding: 0.95rem 1.2rem; border-left: 3px solid var(--violet); border-radius: 0 0.7rem 0.7rem 0; color: #c8d0ec; background: rgba(160, 134, 255, 0.08); }
    blockquote > :first-child { margin-top: 0; }
    blockquote > :last-child { margin-bottom: 0; }
    code { padding: 0.14em 0.38em; border: 1px solid rgba(142, 162, 225, 0.17); border-radius: 0.32rem; color: #bff5ff; background: rgba(98, 231, 255, 0.08); font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 0.86em; }
    pre { position: relative; overflow: auto; margin: 1.35rem 0; padding: 1.15rem 1.25rem; border: 1px solid rgba(145, 166, 239, 0.17); border-radius: 0.85rem; background: var(--code); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025); }
    pre code { display: block; min-width: max-content; padding: 0; border: 0; border-radius: 0; color: #dce6ff; background: transparent; font-size: 0.83rem; line-height: 1.7; }
    pre:has(code.language-mermaid)::before { display: block; margin-bottom: 0.7rem; color: var(--violet); content: "Mermaid diagram source"; font: 700 0.7rem/1 Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
    table { display: block; width: max-content; max-width: 100%; overflow: auto; margin: 1.5rem 0; border: 1px solid var(--line); border-collapse: separate; border-spacing: 0; border-radius: 0.7rem; }
    th, td { min-width: 7rem; padding: 0.7rem 0.85rem; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: 0.9rem; }
    th { color: #f5f7ff; background: rgba(117, 134, 208, 0.14); font-weight: 700; }
    tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }
    img { display: block; max-width: 100%; height: auto; margin: 1.4rem auto; border-radius: 0.7rem; }
    input[type="checkbox"] { accent-color: var(--cyan); }
    .anchor { margin-left: 0.4rem; color: var(--muted); opacity: 0; text-decoration: none; transition: opacity 150ms ease; }
    h1:hover .anchor, h2:hover .anchor, h3:hover .anchor, h4:hover .anchor, .anchor:focus { opacity: 1; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (max-width: 600px) { .article { width: min(calc(100% - 1.5rem), 940px); padding-top: 1.5rem; } h2 { margin-top: 2.7rem; } th, td { min-width: 6rem; padding: 0.55rem 0.65rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
</head>
<body>
  <main id="app" class="loading" aria-live="polite"><p><span></span>正在加载文章…</p></main>
  <script>
    (() => {
      const app = document.querySelector('#app');
      const params = new URLSearchParams(window.location.search);
      const requestedDocument = params.get('doc') || '';
      const documentPattern = /^ai_learning\/[a-zA-Z0-9_./-]+\.md$/;

      function escapeHtml(value) {
        return value.replace(/[&<>"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[character]);
      }

      function fallbackMarkdown(source) {
        return source.split(/\r?\n/).map((line) => {
          const heading = line.match(/^(#{1,4})\s+(.+)$/);
          if (heading) return `<h${heading[1].length}>${escapeHtml(heading[2])}</h${heading[1].length}>`;
          if (/^---+$/.test(line.trim())) return '<hr>';
          if (/^>\s?/.test(line)) return `<blockquote>${escapeHtml(line.replace(/^>\s?/, ''))}</blockquote>`;
          if (!line.trim()) return '';
          return `<p>${escapeHtml(line)}</p>`;
        }).join('\n');
      }

      function sanitizeAndEnhance(markup, currentDocument) {
        const template = document.createElement('template');
        template.innerHTML = markup;
        template.content.querySelectorAll('script, iframe, object, embed, style, link, form, base, meta').forEach((node) => node.remove());
        template.content.querySelectorAll('*').forEach((element) => {
          [...element.attributes].forEach((attribute) => {
            const name = attribute.name.toLowerCase();
            const value = attribute.value.trim();
            if (name.startsWith('on') || name === 'style' || ((name === 'href' || name === 'src') && /^(javascript|data|vbscript):/i.test(value))) {
              element.removeAttribute(attribute.name);
            }
          });
        });

        const currentUrl = new URL(currentDocument, window.location.origin + window.location.pathname);
        template.content.querySelectorAll('a[href]').forEach((link) => {
          const originalHref = link.getAttribute('href');
          if (!originalHref || originalHref.startsWith('#')) return;
          if (/^(https?:|mailto:)/i.test(originalHref)) {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            return;
          }
          const resolvedUrl = new URL(originalHref, currentUrl);
          if (resolvedUrl.pathname.endsWith('.md') && resolvedUrl.pathname.startsWith('/ai_learning/')) {
            link.href = `reader.html?doc=${encodeURIComponent(resolvedUrl.pathname.slice(1))}${resolvedUrl.hash}`;
          }
        });
        template.content.querySelectorAll('img[src]').forEach((image) => {
          const originalSrc = image.getAttribute('src');
          if (originalSrc && !/^(https?:|\/)/i.test(originalSrc)) image.src = new URL(originalSrc, currentUrl).pathname;
        });
        template.content.querySelectorAll('h1, h2, h3, h4').forEach((heading) => {
          if (!heading.id) return;
          const anchor = document.createElement('a');
          anchor.className = 'anchor';
          anchor.href = `#${heading.id}`;
          anchor.setAttribute('aria-label', `定位到 ${heading.textContent}`);
          anchor.textContent = '#';
          heading.append(anchor);
        });
        return template.innerHTML;
      }

      function announceTitle(markdown) {
        const title = markdown.match(/^#\s+(.+)$/m)?.[1].trim() || '博客文章';
        document.title = `${title} · NEWLIFE.007`;
        if (window.parent !== window) window.parent.postMessage({ type: 'blog-reader-title', title, documentPath: requestedDocument }, window.location.origin);
      }

      async function loadDocument() {
        if (!documentPattern.test(requestedDocument) || requestedDocument.includes('..')) throw new Error('无效的文章地址。');
        const response = await fetch(`./${requestedDocument}`, { credentials: 'same-origin' });
        if (!response.ok) throw new Error(`文章加载失败（HTTP ${response.status}）。`);
        const markdown = await response.text();
        announceTitle(markdown);
        const markup = window.marked ? window.marked.parse(markdown, { gfm: true, breaks: false, headerIds: true, mangle: false }) : fallbackMarkdown(markdown);
        app.className = 'article';
        app.removeAttribute('aria-live');
        app.innerHTML = sanitizeAndEnhance(markup, requestedDocument);
      }

      window.addEventListener('DOMContentLoaded', () => {
        loadDocument().catch((error) => {
          app.className = 'error';
          app.innerHTML = `<div><h1>暂时无法打开文章</h1><p>${escapeHtml(error.message)} 请返回内容库后重试。</p></div>`;
        });
      });
    })();
  </script>
</body>
</html>
